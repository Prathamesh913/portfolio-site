<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Prathamesh</title>
  <!-- iOS applies its own squircle mask, so this is a full-bleed square with no
       transparency (iOS composites transparent PNGs onto black). -->
  <rect width="64" height="64" fill="#0a0a0a"/>
  <g fill="#EC5B2B">
    <rect x="15" y="14" width="34" height="26" rx="5"/>
    <rect x="15" y="14" width="7" height="40"/>
  </g>
  <rect x="22" y="21" width="20" height="12" rx="3" fill="#0a0a0a"/>
  <rect x="0" y="58" width="64" height="6" fill="#EC5B2B"/>
</svg>
