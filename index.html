<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Prathamesh's digital practice: design, build, explore." />
    <meta name="color-scheme" content="dark light" />
    <script>
      try {
        var t = localStorage.getItem("portfolio-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    </script>
    <!-- Devanagari "प्र" (pra) mark — paired by scheme so the glyph is ink on
         light browser chrome and cream on dark, each on a transparent
         background. -->
    <link rel="icon" href="/favicon-pra-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon-pra-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://open.spotify.com" />
    <title>Prathamesh | Design, build, explore</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
