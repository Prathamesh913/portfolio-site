<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Prathamesh's digital practice: design, build, explore." />
    <meta name="color-scheme" content="dark light" />
    <script>
      try {
        var t = localStorage.getItem("portfolio-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    </script>
    <!-- Devanagari "प्र" (pra) mark in the site's brand orange — reads on both
         light and dark browser chrome, so one transparent icon serves both. -->
    <link rel="icon" href="/favicon-pra.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://open.spotify.com" />
    <!-- Only the three codepoints behind प्र — the backdrop's mark (~1 KB). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500&text=%E0%A4%AA%E0%A5%8D%E0%A4%B0&display=swap"
      rel="stylesheet"
    />
    <title>Prathamesh | Design, build, explore</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
